name: Update casks

# Pulls the ready-made cask attached to the latest Notch Hider release.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      test_push:
        description: "Only test the push path: push an empty commit to a throwaway branch, then delete it"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: update-casks
  cancel-in-progress: false

jobs:
  update:
    name: Update notchhider cask
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # push the updated cask to this repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # the token is only handed to the push step below

      - name: Fetch cask from latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo NiZZioN/NotchHider --pattern notchhider.rb --dir "$RUNNER_TEMP/cask" --clobber
          mkdir -p Casks
          cp "$RUNNER_TEMP/cask/notchhider.rb" Casks/notchhider.rb

      - name: Commit if changed
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_PUSH: ${{ inputs.test_push }}   # empty on scheduled runs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$TEST_PUSH" = "true" ]; then
            branch="test-push/$GITHUB_RUN_ID"
            git commit --allow-empty -m "test push"
            gh auth setup-git
            git push origin "HEAD:refs/heads/$branch"
            git push origin --delete "$branch"
            echo "Push path OK (pushed and deleted $branch)."
            exit 0
          fi
          if [ -z "$(git status --porcelain Casks)" ]; then echo "Cask already up to date."; exit 0; fi
          git add Casks
          git commit -m "notchhider: update to latest release"
          gh auth setup-git
          git push origin "HEAD:$GITHUB_REF_NAME"
