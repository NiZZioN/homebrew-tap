name: Update casks

# Pulls the ready-made cask attached to the latest Notch Hider release.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-casks
  cancel-in-progress: false

jobs:
  update:
    name: Update notchhider cask
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # push the updated cask to this repo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false   # the token is only handed to the push step below

      - name: Fetch cask from latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo NiZZioN/NotchHider --pattern notchhider.rb --dir "$RUNNER_TEMP/cask" --clobber
          mkdir -p Casks
          cp "$RUNNER_TEMP/cask/notchhider.rb" Casks/notchhider.rb

      - name: Commit if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain Casks)" ]; then echo "Cask already up to date."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks
          git commit -m "notchhider: update to latest release"
          gh auth setup-git
          git push origin "HEAD:$GITHUB_REF_NAME"
